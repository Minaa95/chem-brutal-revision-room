<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station 01 • Write & Wipe</title><style>*{box-sizing:border-box}body{margin:0;background:#090d16;color:#f8fafc;font-family:Arial,sans-serif}.head{padding:16px 4%;border-bottom:1px solid #29364e}.k{color:#ffd43b;font-weight:900;letter-spacing:.14em;font-size:12px}h1{margin:4px 0;font-size:clamp(28px,5vw,46px)}.sub{color:#aab6ca;font-weight:bold}.prog{display:flex;gap:5px;margin-top:10px}.pip{height:6px;flex:1;background:#26344e;border-radius:9px}.pip.on{background:#ffd43b}main{max-width:1100px;margin:auto;padding:20px 3% 160px}.row,.student{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.num{color:#35d0ff;font-weight:900}.marks{padding:7px 10px;background:#202b40;border-radius:9px;font-weight:900}.card{background:#111827;border:1px solid #2b3954;border-radius:18px;padding:clamp(18px,3vw,30px)}.q{font-size:clamp(19px,2.6vw,28px);font-weight:800;line-height:1.45}.eq{text-align:center;background:#0c1321;padding:13px;border-radius:12px;font-size:25px;font-weight:900}canvas{display:block;width:100%;height:330px;background:#fff;border-radius:14px;touch-action:none;margin-top:18px}.small,.scoreBtn{padding:10px 12px;border:1px solid #2b3954;background:#202b40;color:white;border-radius:9px;font-weight:bold}.ans,.scorebox{display:none;margin-top:14px;padding:16px;border-radius:13px}.ans{background:#10271d;border:1px solid #2f7650;line-height:1.55}.ans.show{display:block}.ans b{color:#55e38f}.scorebox{background:#0c1321;border:1px solid #2b3954}.scoreBtn{margin:8px 5px 0 0;min-width:46px}.scoreBtn.sel{background:#55e38f;color:#07150d}footer{position:fixed;bottom:0;left:0;right:0;background:#090d16f5;border-top:1px solid #2b3954;padding:10px 3%}.nav{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:9px}.btn{min-height:52px;border:0;border-radius:12px;font-weight:900}.prev{background:#202b40;color:white}.rev{background:#ffd43b}.next{background:#35d0ff}.start{position:fixed;inset:0;z-index:10;background:#090d16;display:grid;place-items:center;padding:20px}.box{width:min(560px,100%);background:#111827;border:1px solid #2b3954;border-radius:22px;padding:28px;text-align:center}.box input{width:100%;padding:15px;border-radius:12px;border:0;font-size:18px;font-weight:800}.go{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#ffd43b;font-weight:950}.leader{text-align:left;margin-top:18px}.leader li{padding:4px}.student{max-width:1100px;margin:10px auto 0;color:#aab6ca;font-weight:bold}.student b{color:white}@media(max-width:600px){.nav{grid-template-columns:1fr 1fr}.rev{grid-column:1/-1;grid-row:1}canvas{height:290px}}</style></head><body><div id="start" class="start"><div class="box"><div class="k">CHEM-BRUTAL • STATION 01</div><h1>WRITE &amp; WIPE</h1><p class="sub">Enter your name. Your score will be ranked on this device. 😈</p><input id="name" maxlength="30" placeholder="TYPE YOUR NAME..."><button id="go" class="go">ENTER THE ARENA ⚡</button><div id="board" class="leader"></div></div></div><div class="head"><div class="k">CHEM-BRUTAL • STATION 01</div><h1>WRITE &amp; WIPE</h1><div class="sub">10 MINUTES • 8 CHALLENGES • NO PAPER</div><div id="prog" class="prog"></div><div class="student"><span>PLAYER: <b id="player">—</b></span><span>SCORE: <b id="score">0 / 13</b></span></div></div><main><div class="row"><div id="num" class="num"></div><div id="marks" class="marks"></div></div><div class="card"><div id="q" class="q"></div><div id="eq" class="eq" style="display:none"></div><canvas id="pad"></canvas><button id="clear" class="small">CLEAR WRITING</button><div id="ans" class="ans"></div><div id="scorebox" class="scorebox"><b>SELF-MARK THIS QUESTION</b><div id="scoreBtns"></div></div></div></main><footer><div class="nav"><button id="prev" class="btn prev">← PREVIOUS</button><button id="reveal" class="btn rev">REVEAL ANSWER</button><button id="next" class="btn next">NEXT QUESTION →</button></div></footer><script>
const Q=[
[2,"Copper consists of two naturally occurring isotopes, ⁶³Cu and ⁶⁵Cu. The percentage abundances are 69.2% and 30.8%, respectively. Calculate the average atomic mass of copper.","","<b>63.62 u</b><br>[(63)(69.2)+(65)(30.8)]/100 = 63.62 u.<br>M1 substitution • M2 answer with unit."],
[1,"Write the electronic configuration of ⁵⁶₂₆Fe²⁺.","","<b>1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶</b><br>Accept [Ar] 3d⁶. Remove 4s electrons before 3d."],
[2,"Draw the Lewis structure of XeF₄.","","<b>Xe central atom</b> with four Xe–F single bonds and two lone pairs on Xe. Each F has three lone pairs."],
[1,"State the molecular shape of XeF₄.","","<b>Square planar.</b>"],
[2,"A gas occupies 2.40 L at 27 °C. Calculate its volume at 127 °C if pressure remains constant.","","V₁/T₁ = V₂/T₂; T = 300 K and 400 K.<br><b>V₂ = 3.20 L.</b>"],
[1,"For the equilibrium below, predict the direction of shift when volume is decreased.","N₂(g) + 3H₂(g) ⇌ 2NH₃(g)   ΔH < 0","<b>RIGHT.</b> Increased pressure favours the side with fewer moles of gas."],
[3,"Calculate the pH of 0.0100 M CH₃COOH. Given Kₐ = 1.8 × 10⁻⁵.","","[H⁺] ≈ √(KₐC) = 4.24 × 10⁻⁴ M.<br><b>pH = 3.37.</b>"],
[1,"State whether an aqueous solution of NH₄Cl is acidic, basic or neutral. Write the hydrolysis equation that supports your answer.","","<b>Acidic.</b><br>NH₄⁺(aq) + H₂O(l) ⇌ NH₃(aq) + H₃O⁺(aq). Cl⁻ does not significantly hydrolyse."]
];let i=0,student="",earned=Array(8).fill(null),c=document.getElementById("pad"),ctx=c.getContext("2d"),draw=false;const $=x=>document.getElementById(x);function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle="#111827"}function wipe(){ctx.clearRect(0,0,c.width,c.height)}function p(e){let r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}c.onpointerdown=e=>{draw=true;ctx.beginPath();ctx.moveTo(...p(e));c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(draw){ctx.lineTo(...p(e));ctx.stroke()}};c.onpointerup=()=>draw=false;function total(){return earned.reduce((a,v)=>a+(v||0),0)}function scoreBtns(){let h="";for(let n=0;n<=Q[i][0];n++)h+=`<button class="scoreBtn ${earned[i]===n?"sel":""}" onclick="mark(${n})">${n}</button>`;$("scoreBtns").innerHTML=h}window.mark=n=>{earned[i]=n;scoreBtns();$("score").textContent=`${total()} / 13`} ;function render(){let z=Q[i];$("num").textContent=`CHALLENGE ${String(i+1).padStart(2,"0")} / 08`;$("marks").textContent=`${z[0]} mark${z[0]>1?"s":""}`;$("q").textContent=z[1];$("eq").innerHTML=z[2];$("eq").style.display=z[2]?"block":"none";$("ans").innerHTML=z[3];$("ans").classList.remove("show");$("scorebox").style.display="none";$("reveal").textContent="REVEAL ANSWER";$("prev").disabled=i===0;$("next").textContent=i===7?"FINISH & RANK ✓":"NEXT QUESTION →";$("prog").innerHTML=Q.map((_,n)=>`<div class="pip ${n<=i?"on":""}"></div>`).join("");$("score").textContent=`${total()} / 13`;wipe();scrollTo(0,0)}function rows(){return JSON.parse(localStorage.getItem("chemBrutalS1")||"[]").sort((a,b)=>b.score-a.score||a.time-b.time)}function board(){let r=rows().slice(0,10);$("board").innerHTML="<h3>🏆 LOCAL LEADERBOARD</h3>"+(r.length?"<ol>"+r.map(x=>`<li><b>${x.name}</b> — ${x.score}/13</li>`).join("")+"</ol>":"No survivors yet. Be the first. 😈")}function finish(){if(earned.some(v=>v===null)){alert("Reveal and self-mark every question before ranking. 👀");return}let r=rows();r.push({name:student,score:total(),time:Date.now()});localStorage.setItem("chemBrutalS1",JSON.stringify(r.slice(-100)));alert(`STATION 01 COMPLETE! ⚡\n${student}: ${total()}/13`);i=0;earned=Array(8).fill(null);$("start").style.display="grid";board()}$("clear").onclick=wipe;$("reveal").onclick=()=>{let a=$("ans"),s=!a.classList.contains("show");a.classList.toggle("show",s);$("scorebox").style.display=s?"block":"none";$("reveal").textContent=s?"HIDE ANSWER":"REVEAL ANSWER";if(s)scoreBtns()};$("prev").onclick=()=>{if(i){i--;render()}};$("next").onclick=()=>{if(i<7){i++;render()}else finish()};$("go").onclick=()=>{let n=$("name").value.trim();if(!n)return alert("Type your name first 😭");student=n;$("player").textContent=n;$("start").style.display="none";render()};$("name").onkeydown=e=>{if(e.key==="Enter")$("go").click()};board();requestAnimationFrame(()=>{size();render()});window.onresize=()=>setTimeout(size,100);
</script></body></html>
